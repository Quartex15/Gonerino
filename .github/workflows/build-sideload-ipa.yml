name: Build YouTube + Gonerino

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/sideload-build-trigger'

permissions:
  contents: write

jobs:
  build-sideload-ipa:
    runs-on: macos-15
    env:
      YOUTUBE_IPA_URL: ${{ secrets.YOUTUBE_IPA_URL }}

    steps:
      - name: Checkout Gonerino fork
        uses: actions/checkout@v7

      - name: Validate private IPA source
        shell: bash
        run: |
          if [ -z "$YOUTUBE_IPA_URL" ]; then
            echo "::error::Repository secret YOUTUBE_IPA_URL is missing."
            exit 1
          fi

      - name: Prepare Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1.5

      - name: Install build dependencies
        shell: bash
        run: |
          brew install make
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader "$THEOS/include/YouTubeHeader"
          python3 -m pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          gmake --version
          cyan --help >/dev/null

      - name: Build Gonerino
        shell: bash
        run: |
          gmake clean
          gmake package FINALPACKAGE=1
          DEB_FILE=$(find packages -maxdepth 1 -type f -name '*iphoneos-arm64.deb' -print -quit)
          if [ -z "$DEB_FILE" ] || [ ! -f "$DEB_FILE" ]; then
            echo "::error::Gonerino .deb was not produced."
            exit 1
          fi
          echo "GONERINO_DEB=$DEB_FILE" >> "$GITHUB_ENV"
          echo "Gonerino package: $DEB_FILE"

      - name: Download and validate decrypted YouTube IPA
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 2 -o YouTube.ipa "$YOUTUBE_IPA_URL"
          unzip -tq YouTube.ipa >/dev/null

          INFO_PATH=$(zipinfo -1 YouTube.ipa | awk '/^Payload\/[^/]+\.app\/Info\.plist$/ {print; exit}')
          if [ -z "$INFO_PATH" ]; then
            echo "::error::No iOS application Info.plist found in the IPA."
            exit 1
          fi

          APP_DIR=$(dirname "$INFO_PATH")
          EXECUTABLE=$(unzip -p YouTube.ipa "$INFO_PATH" | plutil -extract CFBundleExecutable raw -)
          VERSION=$(unzip -p YouTube.ipa "$INFO_PATH" | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(unzip -p YouTube.ipa "$INFO_PATH" | plutil -extract CFBundleVersion raw -)
          fi

          unzip -p YouTube.ipa "$APP_DIR/$EXECUTABLE" > youtube-executable
          chmod +x youtube-executable
          CRYPTID=$(otool -arch arm64 -l youtube-executable 2>/dev/null | awk '/cryptid/{print $2; exit}')
          if [ "$CRYPTID" != "0" ]; then
            echo "::error::The supplied YouTube IPA does not appear to be decrypted (cryptid=$CRYPTID)."
            exit 1
          fi

          echo "YT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_IPA=YouTube-Gonerino_${VERSION}.ipa" >> "$GITHUB_ENV"
          echo "Validated decrypted YouTube $VERSION"

      - name: Inject Gonerino
        shell: bash
        run: |
          cyan -duwsgq -i YouTube.ipa -o "$OUTPUT_IPA" -f "$GONERINO_DEB"
          test -s "$OUTPUT_IPA"
          unzip -tq "$OUTPUT_IPA" >/dev/null
          shasum -a 256 "$OUTPUT_IPA"

      - name: Create private draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: sideload-${{ github.run_number }}
          name: 'YouTube + Gonerino ${{ env.YT_VERSION }} (private draft)'
          draft: true
          prerelease: true
          files: ${{ env.OUTPUT_IPA }}
          fail_on_unmatched_files: true
          body: |
            Personal sideload build generated from the current Gonerino fork.
            This release is intentionally kept as a draft and must not be published.

      - name: Summary
        shell: bash
        run: |
          echo '### Build complete' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Gonerino: $(grep '^Version:' control | cut -d' ' -f2)" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube: $YT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: $OUTPUT_IPA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Delivery: draft GitHub Release (visible only to users with push access)' >> "$GITHUB_STEP_SUMMARY"
